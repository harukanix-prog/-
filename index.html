<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>🐧 ご予約注文フォーム</title>

  <style>
    :root{
      --blue:#3498db;
      --line:#06C755;
      --danger:#e74c3c;
      --bg:#ffffff;
      --card:#fdfdfd;
      --border:#eee;
      --muted:#777;
    }
    body{
      margin:0;
      background:var(--bg);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans JP",sans-serif;
      color:#333;
      -webkit-text-size-adjust: 100%;
    }
    #pg-form{
      max-width:720px;
      margin:0 auto;
      padding:12px 12px 150px;
    }
    h3{
      text-align:center;
      color:var(--blue);
      margin:10px 0 16px;
      font-size:20px;
      font-weight:900;
    }

    .pg-card{
      background:var(--card);
      border:1px solid var(--border);
      padding:12px;
      border-radius:12px;
      margin-bottom:10px;
    }
    .pg-title{
      font-weight:900;
      font-size:15px;
      margin-bottom:8px;
      display:block;
    }

    .pg-input-field{
      width:100%;
      padding:14px 12px;
      border:1px solid #ccc;
      border-radius:10px;
      font-size:18px;
      box-sizing:border-box;
      background:#fff;
    }

    .pg-cat-tag{
      background:#34495e;
      color:#fff;
      padding:7px 10px;
      border-radius:10px;
      margin:18px 0 10px;
      font-size:13px;
      font-weight:900;
      letter-spacing:0.2px;
    }

    .pg-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:12px 10px;
      border:1px solid #eee;
      background:#fff;
      border-radius:12px;
      margin-bottom:8px;
      gap:10px;
    }

    .pg-name-box{
      flex:1;
      font-weight:900;
      font-size:17px;
      line-height:1.25;
    }
    .pg-price-tag{
      color:var(--danger);
      font-size:12px;
      margin-left:8px;
      font-weight:900;
      white-space:nowrap;
    }

    .pg-qty{
      width:92px;
      min-width:92px;
      height:46px;
      text-align:center;
      font-size:20px;
      font-weight:900;
      border:2px solid var(--blue);
      border-radius:12px;
      -webkit-appearance:none;
      appearance:none;
      background:#fff;
    }

    /* 売り切れグレー表示（定番） */
    .is-soldout{
      opacity:0.45;
    }
    .is-soldout .pg-qty{
      border-color:#bbb;
      pointer-events:none;
    }

    .pg-help{
      font-size:14px;
      color:#666;
      margin-top:12px;
      line-height:1.5;
    }

    .pg-footer-bar{
      position:fixed;
      bottom:0;
      left:0;
      width:100%;
      background:#fff;
      padding:14px 12px;
      border-top:3px solid var(--blue);
      text-align:center;
      z-index:99999;
      box-shadow:0 -3px 15px rgba(0,0,0,0.08);
    }
    .pg-total-txt{
      font-size:18px;
      font-weight:900;
      margin-bottom:10px;
    }
    .pg-btn-line{
      display:block;
      background:var(--line);
      color:#fff;
      text-decoration:none;
      padding:16px;
      border-radius:999px;
      font-weight:900;
      font-size:18px;
      box-shadow:0 4px 0 #05a346;
    }
    .pg-btn-line.disabled{
      background:#cfcfcf;
      box-shadow:none;
      pointer-events:none;
    }

    /* 読み込み中表示 */
    .pg-loading{
      color:var(--muted);
      font-size:14px;
      padding:10px 0;
    }
  </style>
</head>

<body>
  <div id="pg-form">
    <h3>🐧 ご予約注文フォーム</h3>

    <div class="pg-card">
      <span class="pg-title">■ お名前</span>
      <input type="text" id="custName" class="pg-input-field" placeholder="例：ぺんぎん太郎" />
    </div>

    <div class="pg-card">
      <span class="pg-title">■ 出店場所を選択</span>
      <select id="custPlace" class="pg-input-field">
        <option value="">場所を選択してください</option>
      </select>
      <div id="placeLoading" class="pg-loading">出店日程を読み込み中…</div>
    </div>

    <div class="pg-card">
      <span class="pg-title">■ お受取り希望時間</span>
      <select id="custTime" class="pg-input-field">
        <option value="">時間を選択してください</option>
      </select>
    </div>

    <div id="menuArea">
      <div id="menuLoading" class="pg-loading">メニューを読み込み中…</div>
    </div>

    <div class="pg-help">
      ※入力欄が表示されていない商品は、時間外または売り切れとなります。<br>
      ※細かいご要望（トッピング等）はLINEでお気軽にお知らせください🐧
    </div>
  </div>

  <div class="pg-footer-bar">
    <div class="pg-total-txt">
      合計：<span id="total-val" style="color:#e74c3c; font-size:26px;">0</span>円
    </div>
    <a href="javascript:void(0)" id="sendLineBtn" class="pg-btn-line disabled">
      お名前・場所・時間・メニューを入力してね
    </a>
  </div>

<script>
/* =========================
   ✅ ここだけ書き換えゾーン
========================= */
// ① メニュー（Googleスプレッドシート）
const SPREADSHEET_ID = "1Mz9fN_RMrfDx_ZbYYfmAdgK_srKiW3DkqShJCk8K2sw";
const SHEET_NAME     = "menu";  // はるちゃんのシート名

// ② 出店場所（予約OKカレンダー iCal）
const ICAL_URL = "https://calendar.google.com/calendar/ical/penguin.kitchen8%40gmail.com/public/basic.ics";

/* ========================= */

const LINE_SEND_URL_BASE = "https://line.me/R/msg/text/?";

// CORS回避（Googleカレンダーicsをブラウザでfetchするため）
const CORS_PROXY = "https://api.allorigins.win/raw?url="; 
// もしここが不調なら ↓ に差し替え（どちらか動けばOK）
// const CORS_PROXY = "https://cors.isomorphic-git.org/";
// ※差し替える場合は、fetchUrl = CORS_PROXY + encodeURIComponent(url) の行も少し変える必要あり（言ってくれたら直す）

function gvizUrl() {
  return `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}`;
}

function parseGviz(text){
  const start = text.indexOf("{");
  const end = text.lastIndexOf("}");
  const json = text.substring(start, end + 1);
  return JSON.parse(json);
}

function safeText(v){
  return (v ?? "").toString().trim();
}

function isActive(v){
  // ◯/○/true/1/yes などは全部 “販売中” 扱い
  const s = safeText(v).toLowerCase();
  return (s === "◯" || s === "○" || s === "true" || s === "1" || s === "yes" || s === "y");
}

function isLimitedCategory(cat){
  const c = safeText(cat);
  return c.includes("限定") || c.includes("オリジナル");
}

function isRegularCategory(cat){
  const c = safeText(cat);
  return c.includes("定番");
}

function weekdayJa(dateObj){
  const w = ["日","月","火","水","木","金","土"];
  return w[dateObj.getDay()];
}

function formatDateMdJa(dateObj){
  const m = dateObj.getMonth()+1;
  const d = dateObj.getDate();
  return `${m}/${d}(${weekdayJa(dateObj)})`;
}

function ymdToDateLocal(ymd){
  // ymd: YYYYMMDD -> Date(ローカル)
  const y = Number(ymd.slice(0,4));
  const m = Number(ymd.slice(4,6)) - 1;
  const d = Number(ymd.slice(6,8));
  return new Date(y, m, d, 0, 0, 0, 0);
}

function startOfToday(){
  const now = new Date();
  return new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0,0,0,0);
}

function buildTimeOptions(){
  // 11:30〜16:00 を30分刻み、「ごろ」
  const sel = document.getElementById("custTime");
  const times = [
    "11:30ごろ","12:00ごろ","12:30ごろ","13:00ごろ","13:30ごろ",
    "14:00ごろ","14:30ごろ","15:00ごろ","15:30ごろ","16:00ごろ"
  ];
  for (const t of times){
    const o = document.createElement("option");
    o.value = t;
    o.textContent = t;
    sel.appendChild(o);
  }
}

async function loadMenuFromSheet(){
  const menuLoading = document.getElementById("menuLoading");
  try{
    const res = await fetch(gvizUrl(), { cache: "no-store" });
    const txt = await res.text();
    const data = parseGviz(txt);

    const cols = data.table.cols.map(c => (c.label || "").trim());
    const rows = data.table.rows;

    const idx = (name) => cols.findIndex(c => c === name);

    const iName  = idx("name");
    const iPrice = idx("price");
    const iAct   = idx("active");
    const iSort  = idx("sort");
    const iCat   = idx("category");
    const iNote  = idx("note");

    const items = rows.map(r => {
      const cells = r.c.map(x => x ? (x.v ?? "") : "");
      return {
        name: safeText(cells[iName]),
        price: Number(cells[iPrice] || 0),
        active: isActive(cells[iAct]),
        sort: Number(cells[iSort] || 9999),
        category: safeText(cells[iCat]),
        note: safeText(cells[iNote]),
      };
    }).filter(x => x.name && x.price);

    items.sort((a,b) => a.sort - b.sort);

    // categoryごとにまとめる（出現順）
    const order = [];
    const byCat = new Map();
    for (const it of items){
      const cat = it.category || "メニュー";
      if (!byCat.has(cat)){
        byCat.set(cat, []);
        order.push(cat);
      }
      byCat.get(cat).push(it);
    }

    const menuArea = document.getElementById("menuArea");
    menuArea.innerHTML = "";

    for (const cat of order){
      const list = byCat.get(cat);

      const catTag = document.createElement("div");
      catTag.className = "pg-cat-tag";
      catTag.textContent = `✨ ${cat}`;
      menuArea.appendChild(catTag);

      for (const it of list){
        // 限定/オリジナルは active=false なら “非表示”
        if (!it.active && isLimitedCategory(it.category)) continue;

        const row = document.createElement("div");
        row.className = "pg-row";

        // 定番は active=false なら “グレー表示＆入力不可”
        if (!it.active && isRegularCategory(it.category)) row.classList.add("is-soldout");

        const nameBox = document.createElement("div");
        nameBox.className = "pg-name-box";
        nameBox.innerHTML = `${it.name}<span class="pg-price-tag">${it.price}円</span>`;

        const qty = document.createElement("input");
        qty.type = "number";
        qty.className = "pg-qty";
        qty.min = "0";
        qty.value = "0";
        qty.dataset.name = it.name;
        qty.dataset.price = String(it.price);

        // 定番で売り切れなら入力不可
        if (!it.active && isRegularCategory(it.category)) qty.disabled = true;

        row.appendChild(nameBox);
        row.appendChild(qty);
        menuArea.appendChild(row);
      }
    }

  }catch(e){
    console.error(e);
    const menuArea = document.getElementById("menuArea");
    menuArea.innerHTML = `<div class="pg-loading">⚠️ メニューが読み込めませんでした。スプシの「ウェブに公開」または「リンクを知っている全員が閲覧可」を確認してね。</div>`;
  }finally{
    if (menuLoading) menuLoading.remove();
  }
}

function parseIcsEvents(icsText){
  // 超シンプルICSパーサー：DTSTART(終日)とSUMMARYだけ拾う
  const blocks = icsText.split("BEGIN:VEVENT").slice(1);
  const events = [];

  for (const b of blocks){
    const endIdx = b.indexOf("END:VEVENT");
    const chunk = (endIdx >= 0) ? b.slice(0, endIdx) : b;

    const dtLine = chunk.split("\n").find(l => l.startsWith("DTSTART"));
    const sumLine = chunk.split("\n").find(l => l.startsWith("SUMMARY"));

    if (!dtLine || !sumLine) continue;

    // DTSTART;VALUE=DATE:20260304 みたいなのを想定
    const dtMatch = dtLine.match(/:(\d{8})/);
    const dateYmd = dtMatch ? dtMatch[1] : null;

    // SUMMARY:テキスト
    const summary = sumLine.replace("SUMMARY:", "").trim();

    if (!dateYmd || !summary) continue;

    events.push({ dateYmd, summary });
  }
  return events;
}

async function loadPlacesFromIcal(){
  const placeLoading = document.getElementById("placeLoading");
  const sel = document.getElementById("custPlace");

  try{
    const fetchUrl = CORS_PROXY + encodeURIComponent(ICAL_URL);
    const res = await fetch(fetchUrl, { cache: "no-store" });
    const ics = await res.text();

    const events = parseIcsEvents(ics);

    const today = startOfToday();

    // 今日以降だけ
    const future = events
      .map(e => ({ ...e, date: ymdToDateLocal(e.dateYmd) }))
      .filter(e => e.date >= today)
      .sort((a,b) => a.date - b.date);

    // 重複（同じ日付＋同じsummary）を除去
    const seen = new Set();
    const uniq = [];
    for (const e of future){
      const key = e.dateYmd + "||" + e.summary;
      if (seen.has(key)) continue;
      seen.add(key);
      uniq.push(e);
    }

    // option追加
    for (const e of uniq){
      const label = `${formatDateMdJa(e.date)} ${e.summary}`;
      const o = document.createElement("option");
      o.value = label;
      o.textContent = label;
      sel.appendChild(o);
    }

    // 予定0件ならメッセージ
    if (uniq.length === 0){
      const o = document.createElement("option");
      o.value = "";
      o.textContent = "（予約OKの出店予定がありません）";
      sel.appendChild(o);
    }

  }catch(e){
    console.error(e);
    // 失敗してもフォームが死なないようにする
    const o = document.createElement("option");
    o.value = "";
    o.textContent = "⚠️ 出店日程が読み込めません（後で再読込してね）";
    sel.appendChild(o);
  }finally{
    if (placeLoading) placeLoading.remove();
  }
}

function calcTotal(){
  const inputs = Array.from(document.querySelectorAll(".pg-qty"));
  let total = 0;
  for (const input of inputs){
    const price = Number(input.dataset.price || 0);
    const qty = Number(input.value || 0);
    total += price * qty;
  }
  document.getElementById("total-val").textContent = total.toLocaleString();
  return total;
}

function refreshSendButton(){
  const name = document.getElementById("custName").value.trim();
  const place = document.getElementById("custPlace").value;
  const time  = document.getElementById("custTime").value;
  const sum = calcTotal();

  const btn = document.getElementById("sendLineBtn");
  const ok = !!name && !!place && !!time && sum > 0;

  if (ok){
    btn.classList.remove("disabled");
    btn.textContent = "LINEに注文を送る";
  }else{
    btn.classList.add("disabled");
    btn.textContent = "お名前・場所・時間・メニューを入力してね";
  }
}

function buildAndSendLine(){
  const inputs = Array.from(document.querySelectorAll(".pg-qty"));
  const name = document.getElementById("custName").value.trim();
  const place = document.getElementById("custPlace").value;
  const time  = document.getElementById("custTime").value;

  let details = "";
  let sum = 0;

  for (const input of inputs){
    const q = Number(input.value || 0);
    if (q > 0){
      details += `・${input.dataset.name} × ${q}\n`;
      sum += q * Number(input.dataset.price || 0);
    }
  }

  if (!name || !place || !time || sum === 0){
    alert("お名前、場所、時間、メニューを正しく入力してください🐧");
    return;
  }

  const msg =
`【予約注文】
■お名前：${name}
■場所：${place}
■時間：${time}

■内容：
${details}──────────
合計：${sum.toLocaleString()}円`;

  const url = LINE_SEND_URL_BASE + encodeURIComponent(msg);
  window.location.href = url;
}

document.addEventListener("DOMContentLoaded", async () => {
  buildTimeOptions();

  // 並列で読み込み（速くなる）
  await Promise.all([
    loadMenuFromSheet(),
    loadPlacesFromIcal()
  ]);

  // 監視
  document.getElementById("custName").addEventListener("input", refreshSendButton);
  document.getElementById("custPlace").addEventListener("change", refreshSendButton);
  document.getElementById("custTime").addEventListener("change", refreshSendButton);

  document.addEventListener("input", (e) => {
    if (e.target && e.target.classList && e.target.classList.contains("pg-qty")){
      refreshSendButton();
    }
  });

  document.getElementById("sendLineBtn").addEventListener("click", (e) => {
    e.preventDefault();
    if (e.currentTarget.classList.contains("disabled")) return;
    buildAndSendLine();
  });

  refreshSendButton();
});
</script>
</body>
</html>
