<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>🐧 ご予約注文フォーム</title>

  <style>
    :root{
      --blue:#3498db;
      --line:#06C755;
      --danger:#e74c3c;
      --bg:#ffffff;
      --muted:#999;
      --card:#fdfdfd;
      --border:#eee;
    }

    body{ margin:0; background:var(--bg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans JP", sans-serif; color:#333; }
    #pg-form{ max-width: 720px; margin:0 auto; padding:12px 12px 140px; }
    h3{ text-align:center; color:var(--blue); margin:10px 0 16px; }

    .pg-card{ background:var(--card); border:1px solid var(--border); padding:12px; border-radius:10px; margin-bottom:10px; }
    .pg-title{ font-weight:800; font-size:15px; margin-bottom:6px; display:block; }

    .pg-input-field{
      width:100%; padding:12px; border:1px solid #ccc; border-radius:8px;
      font-size:17px; box-sizing:border-box;
    }

    /* スマホで字が小さい問題対策 */
    .pg-input-field, .pg-row, .pg-name-box { -webkit-text-size-adjust: 100%; }

    .pg-cat-tag{
      background:#34495e; color:#fff; padding:6px 10px; border-radius:8px;
      margin:18px 0 10px; font-size:13px; font-weight:800;
    }

    .pg-row{
      display:flex; align-items:center; justify-content:space-between;
      padding:12px 8px; border-bottom:1px solid #eee; background:#fff;
      border-radius:10px;
      margin-bottom:8px;
    }

    .pg-name-box{ flex:1; font-weight:800; font-size:16px; line-height:1.25; }
    .pg-price-tag{ color:var(--danger); font-size:12px; margin-left:6px; font-weight:700; }

    .pg-qty{
      width:86px; min-width:86px; height:44px;
      text-align:center; font-size:20px; font-weight:900;
      border:2px solid var(--blue); border-radius:10px; margin-left:10px;
      -webkit-appearance:none;
    }

    /* 売り切れグレー表示（定番） */
    .is-soldout{
      opacity:0.45;
    }
    .is-soldout .pg-qty{
      border-color:#bbb;
      pointer-events:none;
    }

    .pg-footer-bar{
      position:fixed; bottom:0; left:0; width:100%;
      background:#fff; padding:14px 12px; border-top:3px solid var(--blue);
      text-align:center; z-index:99999; box-shadow: 0 -3px 15px rgba(0,0,0,0.08);
    }
    .pg-total-txt{ font-size:18px; font-weight:900; margin-bottom:10px; }
    .pg-btn-line{
      display:block; background:var(--line); color:#fff; text-decoration:none;
      padding:16px; border-radius:999px; font-weight:900; font-size:18px;
      box-shadow:0 4px 0 #05a346;
    }
    .pg-btn-line.disabled{
      background:#cfcfcf; box-shadow:none; pointer-events:none;
    }
    .pg-help{
      font-size:13px; color:#666; margin-top:10px; line-height:1.4;
    }
  </style>
</head>

<body>
  <div id="pg-form">
    <h3>🐧 ご予約注文フォーム</h3>

    <div class="pg-card">
      <span class="pg-title">■ お名前</span>
      <input type="text" id="custName" class="pg-input-field" placeholder="例：ぺんぎん太郎">
    </div>

    <div class="pg-card">
      <span class="pg-title">■ 出店場所を選択</span>
      <select id="custPlace" class="pg-input-field">
        <option value="">場所を選択してください</option>
        <!-- ★ここは「iCalから自動生成」に後で置き換え可能。今は手動でもOK -->
      </select>
    </div>

    <div class="pg-card">
      <span class="pg-title">■ お受取り希望時間</span>
      <select id="custTime" class="pg-input-field">
        <option value="">時間を選択してください</option>
        <option value="11:30ごろ">11:30ごろ</option>
        <option value="12:00ごろ">12:00ごろ</option>
        <option value="12:30ごろ">12:30ごろ</option>
        <option value="13:00ごろ">13:00ごろ</option>
        <option value="13:30ごろ">13:30ごろ</option>
        <option value="14:00ごろ">14:00ごろ</option>
        <option value="14:30ごろ">14:30ごろ</option>
        <option value="15:00ごろ">15:00ごろ</option>
        <option value="15:30ごろ">15:30ごろ</option>
        <option value="16:00ごろ">16:00ごろ</option>
      </select>
    </div>

    <!-- ここに「シートから読み込んだメニュー」が入る -->
    <div id="menuArea"></div>

    <div class="pg-help">
      ※入力欄が表示されていない商品は、時間外または売り切れとなります。<br>
      ※細かいご要望（トッピング等）はLINEでお気軽にお知らせください🐧
    </div>
  </div>

  <div class="pg-footer-bar">
    <div class="pg-total-txt">合計：<span id="total-val" style="color:#e74c3c; font-size:24px;">0</span>円</div>
    <a href="javascript:void(0)" id="sendLineBtn" class="pg-btn-line disabled">お名前・場所・時間・メニューを入力してね</a>
  </div>

<script>
/* =========================
   ✅ ここだけ書き換える
========================= */
const SPREADSHEET_ID = "1Mz9fN_RMrfDx_ZbYYfmAdgK_srKiW3DkqShJCk8K2sw";
const SHEET_NAME     = "MENU";  // ← シート名（例：menu）
/* ========================= */

const LINE_SEND_URL_BASE = "https://line.me/R/msg/text/?"; // 改行OK（今これが安定）

function gvizUrl() {
  return `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}`;
}

function parseGviz(text){
  // gvizは JSON そのままじゃなくて、関数で包まれて返る
  const start = text.indexOf("{");
  const end = text.lastIndexOf("}");
  const json = text.substring(start, end + 1);
  return JSON.parse(json);
}

function todayYmd(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}

function safeText(v){
  return (v ?? "").toString().trim();
}

function isTruthyActive(v){
  // ◯ / ○ / TRUE / true / 1 など全部OKにする
  const s = safeText(v).toLowerCase();
  return (s === "◯" || s === "○" || s === "true" || s === "1" || s === "yes" || s === "y");
}

function isLimitedCategory(cat){
  const c = safeText(cat);
  return c.includes("限定") || c.includes("オリジナル");
}

async function loadMenuFromSheet(){
  const res = await fetch(gvizUrl(), { cache: "no-store" });
  const txt = await res.text();
  const data = parseGviz(txt);

  const cols = data.table.cols.map(c => (c.label || "").trim());
  const rows = data.table.rows;

  // 期待カラム：name, price, active, sort, category, note
  const idx = (name) => cols.findIndex(c => c === name);

  const iName = idx("name");
  const iPrice = idx("price");
  const iActive = idx("active");
  const iSort = idx("sort");
  const iCat = idx("category");
  const iNote = idx("note");

  const items = rows.map(r => {
    const cells = r.c.map(x => x ? (x.v ?? "") : "");
    return {
      name: safeText(cells[iName]),
      price: Number(cells[iPrice] || 0),
      active: isTruthyActive(cells[iActive]),
      sort: Number(cells[iSort] || 9999),
      category: safeText(cells[iCat]),
      note: safeText(cells[iNote]),
    };
  }).filter(x => x.name && x.price);

  // sort昇順
  items.sort((a,b) => a.sort - b.sort);

  // categoryごとに並べる
  const byCat = new Map();
  for (const it of items){
    const cat = it.category || "メニュー";
    if (!byCat.has(cat)) byCat.set(cat, []);
    byCat.get(cat).push(it);
  }

  const menuArea = document.getElementById("menuArea");
  menuArea.innerHTML = "";

  for (const [cat, list] of byCat.entries()){
    const catTag = document.createElement("div");
    catTag.className = "pg-cat-tag";
    catTag.textContent = `✨ ${cat}`;
    menuArea.appendChild(catTag);

    for (const it of list){
      // 限定/オリジナルは active=false なら非表示
      if (!it.active && isLimitedCategory(it.category)) continue;

      const row = document.createElement("div");
      row.className = "pg-row";
      if (!it.active) row.classList.add("is-soldout");

      const nameBox = document.createElement("div");
      nameBox.className = "pg-name-box";
      nameBox.innerHTML = `${it.name}<span class="pg-price-tag">${it.price}円</span>`;

      const qty = document.createElement("input");
      qty.type = "number";
      qty.className = "pg-qty";
      qty.min = "0";
      qty.value = "0";
      qty.dataset.name = it.name;
      qty.dataset.price = String(it.price);
      qty.disabled = !it.active;

      row.appendChild(nameBox);
      row.appendChild(qty);
      menuArea.appendChild(row);
    }
  }
}

function setupPlaceTempOptions(){
  // いったん手動の仮データ（あとでiCal自動生成に置き換えできる）
  const sel = document.getElementById("custPlace");
  const opts = [
    "3/5(木) 喫茶ドーベル",
    "3/6(金) イオン",
    "3/13(金) アイズ商会",
  ];
  for (const v of opts){
    const o = document.createElement("option");
    o.value = v;
    o.textContent = v;
    sel.appendChild(o);
  }
}

function calcTotal(){
  const inputs = Array.from(document.querySelectorAll(".pg-qty"));
  let total = 0;
  for (const input of inputs){
    const price = Number(input.dataset.price || 0);
    const qty = Number(input.value || 0);
    total += price * qty;
  }
  document.getElementById("total-val").textContent = total.toLocaleString();
  return total;
}

function refreshSendButton(){
  const name = document.getElementById("custName").value.trim();
  const place = document.getElementById("custPlace").value;
  const time  = document.getElementById("custTime").value;
  const sum = calcTotal();

  const btn = document.getElementById("sendLineBtn");
  const ok = !!name && !!place && !!time && sum > 0;

  if (ok){
    btn.classList.remove("disabled");
    btn.textContent = "LINEに注文を送る";
  }else{
    btn.classList.add("disabled");
    btn.textContent = "お名前・場所・時間・メニューを入力してね";
  }
}

function buildAndSendLine(){
  const inputs = Array.from(document.querySelectorAll(".pg-qty"));
  const name = document.getElementById("custName").value.trim();
  const place = document.getElementById("custPlace").value;
  const time  = document.getElementById("custTime").value;

  let details = "";
  let sum = 0;

  for (const input of inputs){
    const q = Number(input.value || 0);
    if (q > 0){
      details += `・${input.dataset.name} × ${q}\n`;
      sum += q * Number(input.dataset.price || 0);
    }
  }

  if (!name || !place || !time || sum === 0){
    alert("お名前、場所、時間、メニューを正しく入力してください🐧");
    return;
  }

  const msg =
`【予約注文】
■お名前：${name}
■場所：${place}
■時間：${time}

■内容：
${details}──────────
合計：${sum.toLocaleString()}円`;

  const url = LINE_SEND_URL_BASE + encodeURIComponent(msg);
  window.location.href = url;
}

document.addEventListener("DOMContentLoaded", async () => {
  // メニュー読込
  await loadMenuFromSheet();

  // 場所は仮（あとでiCalから自動にできる）
  setupPlaceTempOptions();

  // 監視
  document.getElementById("custName").addEventListener("input", refreshSendButton);
  document.getElementById("custPlace").addEventListener("change", refreshSendButton);
  document.getElementById("custTime").addEventListener("change", refreshSendButton);

  document.addEventListener("input", (e) => {
    if (e.target && e.target.classList && e.target.classList.contains("pg-qty")){
      refreshSendButton();
    }
  });

  document.getElementById("sendLineBtn").addEventListener("click", (e) => {
    e.preventDefault();
    if (e.currentTarget.classList.contains("disabled")) return;
    buildAndSendLine();
  });

  refreshSendButton();
});
</script>
</body>
</html>
