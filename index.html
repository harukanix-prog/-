<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>🐧 ご予約注文フォーム</title>
  <style>
    :root{
      --blue:#3498db;
      --line:#06C755;
      --danger:#e74c3c;
      --bg:#ffffff;
      --card:#fdfdfd;
      --border:#eee;
      --muted:#777;
    }
    body{
      margin:0;
      background:var(--bg);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans JP",sans-serif;
      color:#333;
      -webkit-text-size-adjust: 100%;
    }
    #pg-form{
      max-width:720px;
      margin:0 auto;
      padding:12px 12px 170px;
    }
    h3{
      text-align:center;
      color:var(--blue);
      margin:10px 0 16px;
      font-size:20px;
      font-weight:900;
    }
    .pg-card{
      background:var(--card);
      border:1px solid var(--border);
      padding:12px;
      border-radius:12px;
      margin-bottom:10px;
    }
    .pg-title{
      font-weight:900;
      font-size:15px;
      margin-bottom:8px;
      display:block;
    }
    .pg-input-field{
      width:100%;
      padding:14px 12px;
      border:1px solid #ccc;
      border-radius:10px;
      font-size:18px;
      box-sizing:border-box;
      background:#fff;
    }
    .pg-cat-tag{
      background:#34495e;
      color:#fff;
      padding:7px 10px;
      border-radius:10px;
      margin:18px 0 10px;
      font-size:13px;
      font-weight:900;
      letter-spacing:0.2px;
    }
    .pg-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:12px 10px;
      border:1px solid #eee;
      background:#fff;
      border-radius:12px;
      margin-bottom:8px;
      gap:10px;
    }
    .pg-name-box{
      flex:1;
      font-weight:900;
      font-size:17px;
      line-height:1.25;
    }
    .pg-price-tag{
      color:var(--danger);
      font-size:12px;
      margin-left:8px;
      font-weight:900;
      white-space:nowrap;
    }
    .pg-qty{
      width:92px;
      min-width:92px;
      height:46px;
      text-align:center;
      font-size:20px;
      font-weight:900;
      border:2px solid var(--blue);
      border-radius:12px;
      -webkit-appearance:none;
      appearance:none;
      background:#fff;
    }
    .is-soldout{ opacity:0.45; }
    .is-soldout .pg-qty{
      border-color:#bbb;
      pointer-events:none;
    }
    .pg-help{
      font-size:14px;
      color:#666;
      margin-top:12px;
      line-height:1.5;
    }
    .pg-footer-bar{
      position:fixed;
      bottom:0;
      left:0;
      width:100%;
      background:#fff;
      padding:14px 12px;
      border-top:3px solid var(--blue);
      text-align:center;
      z-index:99999;
      box-shadow:0 -3px 15px rgba(0,0,0,0.08);
    }
    .pg-total-txt{
      font-size:18px;
      font-weight:900;
      margin-bottom:10px;
    }
    .pg-btn-line{
      display:block;
      background:var(--line);
      color:#fff;
      text-decoration:none;
      padding:16px;
      border-radius:999px;
      font-weight:900;
      font-size:18px;
      box-shadow:0 4px 0 #05a346;
    }
    .pg-btn-line.disabled{
      background:#cfcfcf;
      box-shadow:none;
      pointer-events:none;
    }
    .pg-loading{
      color:var(--muted);
      font-size:14px;
      padding:10px 0;
    }
    .pg-status{
      color:var(--muted);
      font-size:13px;
      padding-top:8px;
      line-height:1.4;
    }
    .pg-warn{ color:#a85a00; font-weight:700; }
    .pg-manual-wrap{
      margin-top:10px;
      display:none;
    }
    .pg-mini-btn{
      margin-top:10px;
      display:inline-block;
      border:1px solid #ddd;
      background:#fff;
      border-radius:10px;
      padding:10px 12px;
      font-weight:900;
      cursor:pointer;
    }
  </style>
</head>
<body>
  <div id="pg-form">
    <h3>🐧 ご予約注文フォーム</h3>

    <div class="pg-card">
      <span class="pg-title">■ お名前</span>
      <input type="text" id="custName" class="pg-input-field" placeholder="例：ぺんぎん太郎" />
    </div>

    <div class="pg-card">
      <span class="pg-title">■ 出店場所を選択</span>
      <select id="custPlace" class="pg-input-field">
        <option value="">場所を選択してください</option>
      </select>

      <div id="placeLoading" class="pg-loading">出店日程を読み込み中…</div>
      <div id="placeStatusNote" class="pg-status"></div>

      <button type="button" id="retryPlaceBtn" class="pg-mini-btn" style="display:none;">もう一度読み込む</button>

      <div id="manualPlaceWrap" class="pg-manual-wrap">
        <div class="pg-status pg-warn">※日程が読み込めない時だけ、ここに手入力できます</div>
        <input type="text" id="custPlaceManual" class="pg-input-field" placeholder="例：3/18(水) そよら新金岡イオン 12-17時" />
      </div>
    </div>

    <div class="pg-card">
      <span class="pg-title">■ お受取り希望時間</span>
      <select id="custTime" class="pg-input-field">
        <option value="">時間を選択してください</option>
      </select>
    </div>

    <div id="menuArea">
      <div id="menuLoading" class="pg-loading">メニューを読み込み中…</div>
    </div>

    <div class="pg-help">
      ※入力欄が表示されていない商品は、時間外または売り切れとなります。<br>
      ※細かいご要望（トッピング等）はLINEでお気軽にお知らせください🐧
    </div>
  </div>

  <div class="pg-footer-bar">
    <div class="pg-total-txt">
      合計：<span id="total-val" style="color:#e74c3c; font-size:26px;">0</span>円
    </div>
    <a href="javascript:void(0)" id="sendLineBtn" class="pg-btn-line disabled">
      お名前・場所・時間・メニューを入力してね
    </a>
  </div>

<script>
/* =========================
   ✅ ここだけ書き換えゾーン
========================= */
// ① メニュー（Googleスプレッドシート）
const SPREADSHEET_ID = "1Mz9fN_RMrfDx_ZbYYfmAdgK_srKiW3DkqShJCk8K2sw";
const SHEET_NAME     = "menu";  // はるちゃんのシート名

// ② 出店場所（GASプロキシ /exec）
const ICAL_PROXY_URL = "https://script.google.com/macros/s/AKfycbxPngyHgUoHPTUGYgkL84gcZyHt5lfCpa3LAFApBYoQUR2HgBkuvDfdpOiEirVpAKDR/exec";

// ③ 表示日数（表示文言用。実際の絞り込みはGAS側）
const SHOW_DAYS = 45;
/* ========================= */

const LINE_SEND_URL_BASE = "https://line.me/R/msg/text/?";

// キャッシュ
const PLACE_CACHE_KEY = "pg_place_cache_v2";
const PLACE_CACHE_TTL_MS = 1000 * 60 * 60 * 12; // 12時間
const PLACE_FETCH_TIMEOUT_MS = 8000;
const PLACE_RETRIES = 1; // 追加リトライ（合計2回）

function safeText(v){ return (v ?? "").toString().trim(); }

function weekdayJa(dateObj){
  const w = ["日","月","火","水","木","金","土"];
  return w[dateObj.getDay()];
}
function formatDateMdJaFromISO(iso){
  // iso: YYYY-MM-DD
  const y = Number(iso.slice(0,4));
  const m = Number(iso.slice(5,7)) - 1;
  const d = Number(iso.slice(8,10));
  const dt = new Date(y, m, d);
  return `${m+1}/${d}(${weekdayJa(dt)})`;
}

function buildTimeOptions(){
  const sel = document.getElementById("custTime");
  const times = [
    "11:30ごろ","12:00ごろ","12:30ごろ","13:00ごろ","13:30ごろ",
    "14:00ごろ","14:30ごろ","15:00ごろ","15:30ごろ","16:00ごろ"
  ];
  for (const t of times){
    const o = document.createElement("option");
    o.value = t;
    o.textContent = t;
    sel.appendChild(o);
  }
}

function parseGviz(text){
  const start = text.indexOf("{");
  const end = text.lastIndexOf("}");
  const json = text.substring(start, end + 1);
  return JSON.parse(json);
}
function gvizUrl() {
  return `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}`;
}
function isActive(v){
  const s = safeText(v).toLowerCase();
  return (s === "◯" || s === "○" || s === "true" || s === "1" || s === "yes" || s === "y");
}
function isLimitedCategory(cat){
  const c = safeText(cat);
  return c.includes("限定") || c.includes("オリジナル");
}
function isRegularCategory(cat){
  const c = safeText(cat);
  return c.includes("定番");
}

async function loadMenuFromSheet(){
  const menuLoading = document.getElementById("menuLoading");
  try{
    const res = await fetch(gvizUrl(), { cache: "no-store" });
    const txt = await res.text();
    const data = parseGviz(txt);
    const cols = data.table.cols.map(c => (c.label || "").trim());
    const rows = data.table.rows;
    const idx = (name) => cols.findIndex(c => c === name);
    const iName  = idx("name");
    const iPrice = idx("price");
    const iAct   = idx("active");
    const iSort  = idx("sort");
    const iCat   = idx("category");
    const iNote  = idx("note");

    const items = rows.map(r => {
      const cells = r.c.map(x => x ? (x.v ?? "") : "");
      return {
        name: safeText(cells[iName]),
        price: Number(cells[iPrice] || 0),
        active: isActive(cells[iAct]),
        sort: Number(cells[iSort] || 9999),
        category: safeText(cells[iCat]),
        note: safeText(cells[iNote]),
      };
    }).filter(x => x.name && x.price);

    items.sort((a,b) => a.sort - b.sort);

    const order = [];
    const byCat = new Map();
    for (const it of items){
      const cat = it.category || "メニュー";
      if (!byCat.has(cat)){
        byCat.set(cat, []);
        order.push(cat);
      }
      byCat.get(cat).push(it);
    }

    const menuArea = document.getElementById("menuArea");
    menuArea.innerHTML = "";

    for (const cat of order){
      const list = byCat.get(cat);
      const catTag = document.createElement("div");
      catTag.className = "pg-cat-tag";
      catTag.textContent = `✨ ${cat}`;
      menuArea.appendChild(catTag);

      for (const it of list){
        if (!it.active && isLimitedCategory(it.category)) continue;

        const row = document.createElement("div");
        row.className = "
