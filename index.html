<style>
  #pg-form { max-width: 100%; margin: 0 auto; font-family: sans-serif; color: #333; padding-bottom: 120px; }
  .pg-card { background: #fdfdfd; border: 1px solid #eee; padding: 12px; border-radius: 8px; margin-bottom: 10px; }
  .pg-title { font-weight: bold; font-size: 14px; margin-bottom: 5px; display: block; }
  .pg-input-field { width: 100% !important; padding: 10px !important; border: 1px solid #ccc !important; border-radius: 5px !important; font-size: 16px !important; box-sizing: border-box !important; }

  .pg-cat-tag { background: #34495e; color: #fff; padding: 5px 10px; border-radius: 4px; margin: 20px 0 10px 0; font-size: 12px; font-weight: bold; }

  .pg-row {
    display: flex !important; align-items: center !important; justify-content: space-between !important;
    padding: 10px 5px !important; border-bottom: 1px solid #eee !important; background: #fff !important;
  }
  .pg-name-box { flex: 1 !important; font-weight: bold; font-size: 14px; line-height: 1.3; }
  .pg-price-tag { color: #e74c3c; font-size: 11px; margin-left: 5px; font-weight: normal; }

  .pg-qty {
    width: 70px !important; min-width: 70px !important; height: 40px !important;
    text-align: center !important; font-size: 18px !important; font-weight: bold !important;
    border: 2px solid #3498db !important; border-radius: 6px !important; margin-left: 10px !important;
    -webkit-appearance: none;
  }

  .pg-footer-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: white; padding: 15px; border-top: 3px solid #3498db; text-align: center; z-index: 99999; box-shadow: 0 -3px 15px rgba(0,0,0,0.1); }
  .pg-total-txt { font-size: 18px; font-weight: bold; margin-bottom: 10px; }
  .pg-btn-line { display: block; background: #06C755; color: white !important; text-decoration: none !important; padding: 15px; border-radius: 35px; font-weight: bold; font-size: 18px; box-shadow: 0 4px 0 #05a346; }
</style>

<div id="pg-form">
  <h3 style="text-align:center; color:#3498db;">🐧 ご予約注文フォーム</h3>

  <div class="pg-card">
    <span class="pg-title">■ お名前</span>
    <input type="text" id="custName" class="pg-input-field" placeholder="例：ぺんぎん太郎">
  </div>

  <div class="pg-card">
    <span class="pg-title">■ 出店場所を選択</span>
    <select id="custPlace" class="pg-input-field">
      <option value="">場所を選択してください</option>
      <option value="2/17(火) イオン鴻池">2/17(火) イオン鴻池</option>
      <option value="2/21(土) 堺中央典礼会館">2/21(土) 堺中央典礼会館</option>
      <option value="2/22(日) エコール・ロゼ富田林">2/22(日) エコール・ロゼ富田林</option>
      <option value="2/25(水) そよら新金岡">2/25(水) そよら新金岡</option>
    </select>
  </div>

  <div class="pg-card">
    <span class="pg-title">■ お受取り希望時間</span>
    <select id="custTime" class="pg-input-field">
      <option value="">時間を選択してください</option>
      <option value="11:30ごろ">11:30ごろ</option>
      <option value="12:00ごろ">12:00ごろ</option>
      <option value="13:00ごろ">13:00ごろ</option>
      <option value="14:00ごろ">14:00ごろ</option>
      <option value="15:00ごろ">15:00ごろ</option>
      <option value="16:00ごろ">16:00ごろ</option>
    </select>
  </div>

  <div class="pg-cat-tag">✨ オリジナルクレープ</div>

  <div class="pg-row">
    <div class="pg-name-box">
      生いちごホイップ<span class="pg-price-tag">700円</span>
    </div>
    <input type="number" class="pg-qty" data-name="生いちごホイップ" data-price="700" value="0" min="0">
  </div>

</div>

<div class="pg-footer-bar">
  <div class="pg-total-txt">
    合計：<span id="total-val" style="color:#e74c3c; font-size:24px;">0</span>円
  </div>
  <a href="javascript:void(0)" id="sendLineBtn" class="pg-btn-line">
    LINEに注文を送る
  </a>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  // ====== 設定（ここだけ触ればOK）======
  const ICS_URL = "https://calendar.google.com/calendar/ical/penguin.kitchen8%40gmail.com/public/basic.ics";
  const DAYS_AHEAD = 60; // 何日先まで候補に出すか
  // ======================================

  const inputs = Array.from(document.querySelectorAll('.pg-qty'));
  const totalDisp = document.getElementById('total-val');
  const sendBtn = document.getElementById('sendLineBtn');

  const placeSelect = document.getElementById('custPlace');

  // ---------- 合計計算 ----------
  function calc() {
    let total = 0;
    for (const input of inputs) {
      const price = Number(input.dataset.price || 0);
      const qty = Number(input.value || 0);
      total += price * qty;
    }
    totalDisp.textContent = total.toLocaleString();
  }
  calc();
  for (const input of inputs) {
    input.addEventListener('input', calc);
    input.addEventListener('change', calc);
  }

  // ---------- ICSパース（超軽量版） ----------
  function parseICS(text) {
    // 改行の折返し（RFC）に対応
    const unfolded = text.replace(/\r?\n[ \t]/g, '');
    const blocks = unfolded.split('BEGIN:VEVENT').slice(1);

    const events = [];
    for (const b of blocks) {
      const block = b.split('END:VEVENT')[0];

      const dtStartLine = block.match(/DTSTART[^:]*:(.+)/);
      const summaryLine = block.match(/SUMMARY:(.+)/);

      if (!dtStartLine || !summaryLine) continue;

      const dtRaw = dtStartLine[1].trim();
      const summary = summaryLine[1].trim();

      // DTSTART:20260304 みたいな終日形式を想定（はるちゃん運用）
      // もしDTSTART:20260304T.... が混じっても日付だけ拾う
      const y = dtRaw.slice(0,4);
      const m = dtRaw.slice(4,6);
      const d = dtRaw.slice(6,8);

      if (!/^\d{4}$/.test(y) || !/^\d{2}$/.test(m) || !/^\d{2}$/.test(d)) continue;

      const date = new Date(Number(y), Number(m)-1, Number(d));
      events.push({ date, summary });
    }
    return events;
  }

  function fmtJP(date) {
    // 例: 3/4(水)
    const mm = date.getMonth() + 1;
    const dd = date.getDate();
    const w = ["日","月","火","水","木","金","土"][date.getDay()];
    return `${mm}/${dd}(${w})`;
  }

  function withinRange(date, daysAhead) {
    const today = new Date();
    today.setHours(0,0,0,0);
    const end = new Date(today);
    end.setDate(end.getDate() + daysAhead);

    return date >= today && date <= end;
  }

  function addOption(valueText, labelText) {
    const opt = document.createElement('option');
    opt.value = valueText;
    opt.textContent = labelText;
    placeSelect.appendChild(opt);
  }

  async function loadPlacesFromCalendar() {
    // 失敗してもフォームは動くようにする（保険）
    try {
      // GitHub Pages から Google のICSを読む時、CORSが弾かれることがある
      // その場合は CORSプロキシ経由で読む
      const corsProxy = "https://r.jina.ai/http://";
      const url = corsProxy + ICS_URL.replace(/^https?:\/\//, '');
      const res = await fetch(url);
      const text = await res.text();

      const events = parseICS(text)
        .filter(e => withinRange(e.date, DAYS_AHEAD))
        .sort((a,b) => a.date - b.date);

      // 同じ日・同じSUMMARYの重複を削除
      const seen = new Set();
      for (const e of events) {
        const key = `${e.date.toDateString()}|${e.summary}`;
        if (seen.has(key)) continue;
        seen.add(key);

        const label = `${fmtJP(e.date)} ${e.summary}`;
        // valueも labelと同じにしておく（LINEにそのまま載せやすい）
        addOption(label, label);
      }

      // 候補が0件なら表示
      if (placeSelect.options.length === 1) {
        addOption("（予約OKの出店予定がありません）", "（予約OKの出店予定がありません）");
      }
    } catch (err) {
      // 読み込み失敗時：手動で選べないと困るので案内
      addOption("（読み込み失敗：あとで再読み込みしてください）", "（読み込み失敗：あとで再読み込みしてください）");
    }
  }

  // 起動時に候補生成
  loadPlacesFromCalendar();

  // ---------- LINE送信 ----------
  sendBtn.addEventListener('click', () => {
    const name = document.getElementById('custName').value.trim();
    const place = document.getElementById('custPlace').value;
    const time  = document.getElementById('custTime').value;

    let details = "";
    let sum = 0;

    for (const input of inputs) {
      const q = Number(input.value || 0);
      if (q > 0) {
        details += "・" + input.dataset.name + " × " + q + "\n";
        sum += q * Number(input.dataset.price || 0);
      }
    }

    if (!name || !place || !time || sum === 0 || place.includes("読み込み失敗") || place.includes("ありません")) {
      alert("お名前、場所、時間、メニューを正しく入力してください🐧");
      return;
    }

    const msg =
      "【予約注文】\n" +
      "■お名前：" + name + "\n" +
      "■場所：" + place + "\n" +
      "■時間：" + time + "\n\n" +
      "■内容：\n" +
      details +
      "──────────\n" +
      "合計：" + sum.toLocaleString() + "円";

    const url = "https://line.me/R/msg/text/?" + encodeURIComponent(msg);
    window.location.href = url;
  });
});
</script>
