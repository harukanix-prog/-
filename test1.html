<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ぺんぎんKITCHEN 🐧</title>

<style>

body{
    margin:0;
    font-family:sans-serif;
    background:#f3fbff;
}

/* ===== タイトル ===== */
.header{
    text-align:center;
    font-size:28px;
    font-weight:700;
    padding:16px;
    color:#5c4a3f;
}

/* ===== 出店情報 ===== */
.info{
    margin:12px;
    padding:14px;
    background:#f2f2f2;
    border-radius:16px;
    line-height:1.6;
}

/* ===== 黄色説明 ===== */
.notice{
    margin:12px;
    padding:14px;
    background:#f7ecd7;
    border-radius:16px;
    border:3px solid #e2b86f;
    line-height:1.6;
}

/* ===== セクション ===== */
.section{
    margin:12px;
    padding:14px;
    background:#f2f2f2;
    border-radius:16px;
}

/* ===== 人気 ===== */
.popular-title{
    margin:12px;
    padding:12px;
    border-radius:16px;
    background:#f9e6e6;
    border:2px solid #f1bcbc;
    font-weight:700;
}

/* ===== メニューカード ===== */
.menu-card{
    background:white;
    margin:12px;
    padding:12px;
    border-radius:12px;
}

/* ===== 数量入力 ===== */
.qty{
    width:60px;
    height:44px;
    font-size:20px;
    text-align:center;
    border-radius:12px;
    border:2px solid #ccc;
}

/* ===== 合計 ===== */
.total{
    position:fixed;
    bottom:80px;
    width:100%;
    text-align:center;
    font-size:22px;
    font-weight:700;
}

/* ===== LINEボタン ===== */
.line-btn{
    position:fixed;
    bottom:0;
    width:100%;
    background:#2ecc71;
    color:white;
    font-size:20px;
    padding:18px;
    text-align:center;
    border:none;
}

</style>
</head>

<body>

<div class="header">ぺんぎんKITCHEN 🐧</div>

<div class="info">
ご予約日：2026/04/8（水）<br>
出店場所：田中病院<br>
営業時間：10:00-14:00
</div>

<div class="notice">
🐧 事前予約でスムーズにお渡しできます<br>
📱 お支払いは当日キッチンカーでの現地決済です<br>
（現金・PayPayやクレジットカード等）
</div>

<div class="section">
■ お名前<br>
<input style="width:100%;height:44px;border-radius:12px;border:2px solid #ccc;font-size:18px;">
</div>

<div class="section">
■ お受け取り希望時間<br>
<select style="width:100%;height:44px;border-radius:12px;border:2px solid #e2b86f;font-size:18px;">
<option>12:45</option>
</select>
</div>

<div class="popular-title">🔥 人気メニュー</div>

<div class="menu-card">
チョコバナナ<br>
600円　
<input class="qty" value="0">
</div>

<div class="menu-card">
キャラメルバナナ<br>
600円　
<input class="qty" value="0">
</div>

<div class="total">
🐧お会計ペン：1200円🐧
</div>

<button class="line-btn">
LINEで予約内容を送る
</button>

</body>
</html>
