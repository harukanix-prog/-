<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ぺんぎんKITCHEN 🐧</title>
  <style>
    :root{
      --blue:#3498db;
      --line:#2ecc71;
      --danger:#e74c3c;
      --border:#eee;
      --muted:#777;
      --beige:#f6efe7;
      --gold:#f0c36d;
      --badge-bg:#fff3cd;
      --badge-text:#8a5a00;
      --popular-bg:#fff3f4;
      --popular-border:#f3c7cc;
      --popular-text:#b94b5a;
      --page-bg:#f4f8fb;
      --title-brown:#5f4b3b;
      --card-bg:#f7f7f7;
    }

    body{
      margin:0;
      background:var(--page-bg);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans JP",sans-serif;
      color:#333;
      -webkit-text-size-adjust:100%;
    }

    #pg-form{
      max-width:720px;
      margin:0 auto;
      padding:12px 12px 188px;
      box-sizing:border-box;
    }

    h1{
      text-align:center;
      color:var(--title-brown);
      margin:10px 0 14px;
      font-size:28px;
      line-height:1.2;
      font-weight:900;
      letter-spacing:0.01em;
      font-family:"Hiragino Maru Gothic ProN","Yuji Boku","Hannotate SC","Comic Sans MS","Noto Sans JP",sans-serif;
      text-shadow:0 1px 0 rgba(255,255,255,0.7);
    }

    .pg-fixed-info{
      background:#fff;
      border-radius:12px;
      padding:12px;
      margin-bottom:12px;
      border:1px solid #eee;
      line-height:1.7;
      font-size:15px;
      font-weight:700;
    }

    .pg-info-box{
      background:#fff8e8;
      border:2px solid var(--gold);
      padding:12px 14px;
      border-radius:16px;
      margin:12px 0 16px 0;
      font-size:14px;
      line-height:1.75;
    }

    .pg-menu-image-wrap{
      margin-bottom:20px;
    }

    .pg-menu-image{
      width:100%;
      display:block;
      border-radius:12px;
      margin-bottom:20px;
      background:#fff;
      border:1px solid #eee;
    }

    .pg-card{
      background:#f3f3f3;
      border:1px solid var(--border);
      padding:14px;
      border-radius:16px;
      margin-bottom:14px;
      box-shadow:0 2px 8px rgba(0,0,0,0.05);
    }

    .pg-title{
      font-weight:900;
      font-size:15px;
      margin-bottom:8px;
      display:block;
    }

    .pg-input-field{
      width:100%;
      padding:14px 12px;
      border:1px solid #ccc;
      border-radius:10px;
      font-size:18px;
      box-sizing:border-box;
      background:#fff;
    }

    .pg-section-tag{
      padding:12px 14px;
      border-radius:14px;
      margin:20px 0 8px;
      font-size:15px;
      font-weight:900;
      border:1px solid;
    }

    .pg-popular-tag{
      background:var(--popular-bg);
      color:var(--popular-text);
      border-color:var(--popular-border);
    }

    .pg-cat-tag{
      background:var(--beige);
      color:#6b4f3a;
      border-color:#eadfd3;
    }

    .pg-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:12px 8px;
      border-bottom:1px solid #eee;
      background:#fff;
      gap:10px;
    }

    .pg-item-left{
      display:flex;
      align-items:center;
      gap:10px;
      flex:1;
      min-width:0;
    }

    .pg-name-box{
      flex:1;
      min-width:0;
    }

    .pg-badge{
      display:inline-block;
      background:var(--badge-bg);
      color:var(--badge-text);
      font-size:12px;
      font-weight:900;
      line-height:1;
      padding:6px 8px;
      border-radius:999px;
      margin-bottom:6px;
    }

    .pg-item-name{
      font-weight:900;
      font-size:16px;
      line-height:1.35;
      word-break:break-word;
    }

    .pg-price-tag{
      color:var(--danger);
      font-size:13px;
      margin-top:4px;
      font-weight:900;
      display:block;
    }

    .pg-qty-wrap{
      width:70px;
      flex-shrink:0;
    }

    .pg-qty-input{
      width:100%;
      height:46px;
      border:1px solid #ccc;
      border-radius:10px;
      font-size:20px;
      font-weight:900;
      text-align:center;
      box-sizing:border-box;
      background:#f3f3f3;
      color:#999;
      appearance:textfield;
      -moz-appearance:textfield;
    }

    .pg-qty-input::-webkit-outer-spin-button,
    .pg-qty-input::-webkit-inner-spin-button{
      -webkit-appearance:none;
      margin:0;
    }

    .pg-qty-input.has-value{
      background:#fff;
      color:#333;
      border-color:#3498db;
    }

    .pg-help{
      font-size:14px;
      color:#666;
      margin-top:16px;
      line-height:1.8;
    }

    .pg-footer-bar{
      position:fixed;
      bottom:0;
      left:0;
      width:100%;
      background:#fff;
      padding:16px 12px 18px;
      border-top:3px solid var(--blue);
      text-align:center;
      z-index:99999;
      box-shadow:0 -3px 15px rgba(0,0,0,0.08);
      box-sizing:border-box;
    }

    .pg-total-txt{
      font-size:18px;
      font-weight:900;
      margin-bottom:12px;
      color:#5f4b3b;
      line-height:1.3;
    }

    .pg-btn-line{
      display:block;
      background:var(--line);
      color:#fff;
      text-decoration:none;
      padding:16px;
      border-radius:999px;
      font-weight:900;
      font-size:18px;
      box-shadow:0 4px 0 #25a25a;
    }

    .pg-btn-line.disabled{
      background:#cfcfcf;
      box-shadow:none;
      pointer-events:none;
    }

    .pg-loading{
      color:var(--muted);
      font-size:14px;
      padding:10px 0;
    }

    .pg-status{
      color:var(--muted);
      font-size:13px;
      padding-top:8px;
      line-height:1.4;
    }

    .pg-warn{
      color:#a85a00;
      font-weight:700;
    }

    .pg-manual-wrap{
      margin-top:10px;
      display:none;
    }

    .pg-mini-btn{
      margin-top:10px;
      display:inline-block;
      border:1px solid #ddd;
      background:#fff;
      border-radius:10px;
      padding:10px 12px;
      font-weight:900;
      cursor:pointer;
    }

    @media (max-width: 480px){
      #pg-form{
        padding:12px 12px 192px;
      }

      h1{
        font-size:25px;
        margin:8px 0 12px;
      }

      .pg-row{
        padding:12px 4px;
      }

      .pg-item-name{
        font-size:15px;
      }

      .pg-qty-wrap{
        width:70px;
      }

      .pg-qty-input{
        font-size:20px;
        height:46px;
      }

      .pg-footer-bar{
        padding:14px 12px 16px;
      }

      .pg-total-txt{
        margin-bottom:10px;
      }
    }
  </style>
</head>

<body>
  <div id="pg-form">
    <h1 id="pageTitle">ぺんぎんKITCHEN 🐧</h1>

    <div class="pg-fixed-info">
      <div><strong>ご予約日：</strong><span id="infoDate">未設定</span></div>
      <div><strong>出店場所：</strong><span id="infoPlace">未設定</span></div>
      <div><strong>営業時間：</strong><span id="infoHours">未設定</span></div>
    </div>

    <div class="pg-info-box">
      🐧 事前予約でスムーズにお渡しできます<br>
      💰 お支払いは当日キッチンカーでの現地決済です<br>
      （現金・PayPayやクレジットカード等）
    </div>

    <div class="pg-card">
      <span class="pg-title">■ お名前</span>
      <input type="text" id="custName" class="pg-input-field" placeholder="例：ぺんぎん太郎" />
    </div>

    <div class="pg-card">
      <span class="pg-title">■ 出店場所を選択</span>
      <select id="custPlace" class="pg-input-field">
        <option value="">場所を選択してください</option>
      </select>
      <div id="placeLoading" class="pg-loading">出店日程を読み込み中…</div>
      <div id="placeStatusNote" class="pg-status"></div>
      <button type="button" id="retryPlaceBtn" class="pg-mini-btn" style="display:none;">もう一度読み込む</button>

      <div id="manualPlaceWrap" class="pg-manual-wrap">
        <div class="pg-status pg-warn">※日程が読み込めない時だけ、ここに手入力できます</div>
        <input type="text" id="custPlaceManual" class="pg-input-field" placeholder="例：3/18(水) そよら新金岡イオン 12-17時" />
      </div>
    </div>

    <div class="pg-card">
      <span class="pg-title">■ お受け取り希望時間</span>
      <select id="custTime" class="pg-input-field">
        <option value="">時間を選択してください</option>
      </select>
    </div>

    <div id="menuImageArea"></div>

    <div id="menuArea">
      <div id="menuLoading" class="pg-loading">メニューを読み込み中…</div>
    </div>

    <div class="pg-help">
      ※細かいご要望（トッピング等）はLINEでお気軽にお知らせください🐧<br>
      ※売り切れ商品は表示されない場合があります。
    </div>
  </div>

  <div class="pg-footer-bar">
    <div class="pg-total-txt">
      🐧お会計ペン：<span id="total-val" style="color:#e74c3c; font-size:26px;">0</span>円
    </div>
    <a href="javascript:void(0)" id="sendLineBtn" class="pg-btn-line disabled">
      お名前・場所・時間・メニューを入力してね
    </a>
  </div>

<script>
/* =========================
   ✅ ここだけ書き換えゾーン
========================= */
const SPREADSHEET_ID = "1Mz9fN_RMrfDx_ZbYYfmAdgK_srKiW3DkqShJCk8K2sw";
const SHEET_NAME = "menu";
const ICAL_PROXY_URL = "https://script.google.com/macros/s/AKfycbxPngyHgUoHPTUGYgkL84gcZyHt5lfCpa3LAFApBYoQUR2HgBkuvDfdpOiEirVpAKDR/exec";
const SHOW_DAYS = 45;
/* ========================= */

const LINE_SEND_URL_BASE = "https://line.me/R/msg/text/?";
const PLACE_FETCH_TIMEOUT_MS = 8000;
const PLACE_CACHE_KEY = "pg_place_cache_v2";
const PLACE_CACHE_TTL_MS = 1000 * 60 * 60 * 12;

let selectedDateText = "未設定";
let selectedPlaceText = "未設定";
let selectedHoursText = "未設定";

function safeText(v){ return (v ?? "").toString().trim(); }

function weekdayJa(dateObj){
  const w = ["日","月","火","水","木","金","土"];
  return w[dateObj.getDay()];
}

function formatDateMdJaFromISO(iso){
  const y = Number(iso.slice(0,4));
  const m = Number(iso.slice(5,7)) - 1;
  const d = Number(iso.slice(8,10));
  const dt = new Date(y, m, d);
  return `${m+1}/${d}(${weekdayJa(dt)})`;
}

function parsePlaceLabel(label){
  const txt = safeText(label);
  if (!txt) {
    return { date:"未設定", place:"未設定", hours:"未設定" };
  }

  const hoursMatch = txt.match(/(\d{1,2}:\d{2}\s*[-〜~]\s*\d{1,2}:\d{2}|\d{1,2}\s*[-〜~]\s*\d{1,2}時?)/);
  const dateMatch = txt.match(/^(\d{1,2}\/\d{1,2}\([日月火水木金土]\))/);

  const dateText = dateMatch ? dateMatch[1] : "未設定";
  const hoursText = hoursMatch ? hoursMatch[1].replace(/\s*/g,"") : "未設定";

  let placeText = txt;
  if (dateMatch) placeText = placeText.replace(dateMatch[1], "").trim();
  if (hoursMatch) placeText = placeText.replace(hoursMatch[1], "").trim();
  placeText = placeText.replace(/\s+/g, " ").trim();

  if (!placeText) placeText = txt;

  return {
    date: dateText,
    place: placeText,
    hours: hoursText
  };
}

function updateInfoCardFromPlace(label){
  const parsed = parsePlaceLabel(label);
  selectedDateText = parsed.date;
  selectedPlaceText = parsed.place;
  selectedHoursText = parsed.hours;

  document.getElementById("infoDate").textContent = selectedDateText;
  document.getElementById("infoPlace").textContent = selectedPlaceText;
  document.getElementById("infoHours").textContent = selectedHoursText;
}

function buildTimeOptions(){
  const sel = document.getElementById("custTime");
  const times = [
    "11:30ごろ","12:00ごろ","12:30ごろ","13:00ごろ","13:30ごろ",
    "14:00ごろ","14:30ごろ","15:00ごろ","15:30ごろ","16:00ごろ"
  ];
  sel.innerHTML = '<option value="">時間を選択してください</option>';
  for (const t of times){
    const o = document.createElement("option");
    o.value = t;
    o.textContent = t;
    sel.appendChild(o);
  }
}

function parseGviz(text){
  const start = text.indexOf("{");
  const end = text.lastIndexOf("}");
  const json = text.substring(start, end + 1);
  return JSON.parse(json);
}

function gvizUrl() {
  return `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}`;
}

function isActive(v){
  const s = safeText(v).toLowerCase();
  return (v === true || s === "true" || s === "o" || s === "○" || s === "1" || s === "yes" || s === "y" || s === "✔");
}

function isHeaderCategory(cat){
  return safeText(cat).toLowerCase() === "header";
}

function isPopularBadge(badge){
  return safeText(badge) === "🔥人気";
}

function makeQtyInput(item){
  const wrap = document.createElement("div");
  wrap.className = "pg-qty-wrap";

  const input = document.createElement("input");
  input.type = "number";
  input.inputMode = "numeric";
  input.min = "0";
  input.max = "20";
  input.step = "1";
  input.value = "0";
  input.className = "pg-qty-input";
  input.dataset.name = item.name;
  input.dataset.price = String(item.price);

  const updateState = () => {
    let val = parseInt(input.value, 10);
    if (isNaN(val) || val < 0) val = 0;
    if (val > 20) val = 20;
    input.value = String(val);

    if (val > 0){
      input.classList.add("has-value");
    }else{
      input.classList.remove("has-value");
    }

    updateTotalAndButton();
  };

  input.addEventListener("input", updateState);
  input.addEventListener("change", updateState);
  input.addEventListener("blur", updateState);

  wrap.appendChild(input);
  return wrap;
}

function renderHeaderImages(headerItems){
  const imageArea = document.getElementById("menuImageArea");
  imageArea.innerHTML = "";

  const validImages = headerItems.filter(item => safeText(item.image));
  if (!validImages.length) return;

  const wrap = document.createElement("div");
  wrap.className = "pg-menu-image-wrap";

  for (const item of validImages){
    const img = document.createElement("img");
    img.className = "pg-menu-image";
    img.src = item.image;
    img.alt = item.name || "メニュー画像";
    img.loading = "lazy";
    wrap.appendChild(img);
  }

  imageArea.appendChild(wrap);
}

function makeMenuRow(item){
  const row = document.createElement("div");
  row.className = "pg-row";

  const left = document.createElement("div");
  left.className = "pg-item-left";

  const nameBox = document.createElement("div");
  nameBox.className = "pg-name-box";

  if (safeText(item.badge)){
    const badge = document.createElement("div");
    badge.className = "pg-badge";
    badge.textContent = item.badge;
    nameBox.appendChild(badge);
  }

  const name = document.createElement("div");
  name.className = "pg-item-name";
  name.textContent = item.name;
  nameBox.appendChild(name);

  const price = document.createElement("span");
  price.className = "pg-price-tag";
  price.textContent = `${item.price}円`;
  nameBox.appendChild(price);

  left.appendChild(nameBox);
  row.appendChild(left);
  row.appendChild(makeQtyInput(item));

  return row;
}

function makeSectionTag(text, className){
  const tag = document.createElement("div");
  tag.className = `pg-section-tag ${className}`;
  tag.textContent = text;
  return tag;
}

function renderPopularSection(menuArea, items){
  if (!items.length) return;
  menuArea.appendChild(makeSectionTag("🔥人気メニュー", "pg-popular-tag"));
  for (const item of items){
    menuArea.appendChild(makeMenuRow(item));
  }
}

function renderCategorySections(menuArea, items){
  const categoryOrder = [];
  const byCat = new Map();

  for (const it of items){
    if (!byCat.has(it.category)){
      byCat.set(it.category, []);
      categoryOrder.push(it.category);
    }
    byCat.get(it.category).push(it);
  }

  for (const cat of categoryOrder){
    const list = byCat.get(cat);
    if (!list || !list.length) continue;

    menuArea.appendChild(makeSectionTag(cat, "pg-cat-tag"));

    for (const item of list){
      menuArea.appendChild(makeMenuRow(item));
    }
  }
}

async function loadMenuFromSheet(){
  const menuArea = document.getElementById("menuArea");
  try{
    const res = await fetch(gvizUrl(), { cache: "no-store" });
    const txt = await res.text();
    const data = parseGviz(txt);

    const cols = data.table.cols.map(c => (c.label || "").trim());
    const rows = data.table.rows;

    const idx = (name) => cols.findIndex(c => c === name);

    const iName   = idx("name");
    const iPrice  = idx("price");
    const iAct    = idx("active");
    const iSort   = idx("sort");
    const iCat    = idx("category");
    const iNote   = idx("note");
    const iBadge  = idx("badge");
    const iImage  = idx("image");

    const items = rows.map(r => {
      const cells = r.c.map(x => x ? (x.v ?? "") : "");
      return {
        name: safeText(cells[iName]),
        price: Number(cells[iPrice] || 0),
        active: isActive(cells[iAct]),
        sort: Number(cells[iSort] || 9999),
        category: safeText(cells[iCat]) || "メニュー",
        note: safeText(cells[iNote]),
        badge: safeText(cells[iBadge]),
        image: safeText(cells[iImage])
      };
    }).filter(x => x.name && x.price);

    items.sort((a,b) => a.sort - b.sort);

    const headerItems = items.filter(it => isHeaderCategory(it.category));
    renderHeaderImages(headerItems);

    const visibleMenuItems = items.filter(it => {
      if (isHeaderCategory(it.category)) return false;
      if (!it.active) return false;
      if (!it.name) return false;
      if (!it.price) return false;
      return true;
    });

    const popularItems = visibleMenuItems.filter(it => isPopularBadge(it.badge));
    const normalItems = visibleMenuItems.filter(it => !isPopularBadge(it.badge));

    menuArea.innerHTML = "";

    if (!visibleMenuItems.length){
      menuArea.innerHTML = `<div class="pg-loading">現在表示できるメニューがありません。</div>`;
      updateTotalAndButton();
      return;
    }

    renderPopularSection(menuArea, popularItems);
    renderCategorySections(menuArea, normalItems);
    updateTotalAndButton();

  }catch(e){
    menuArea.innerHTML = `<div class="pg-loading">メニューの読み込みに失敗しました。<br>（スプレッドシートの公開設定を確認してください）</div>`;
  }
}

function setPlaceStatusNote(text){
  const el = document.getElementById("placeStatusNote");
  if (!el) return;
  el.textContent = text || "";
}

function setManualMode(enable){
  const manualWrap = document.getElementById("manualPlaceWrap");
  const retryBtn = document.getElementById("retryPlaceBtn");
  if (manualWrap) manualWrap.style.display = enable ? "block" : "none";
  if (retryBtn) retryBtn.style.display = enable ? "inline-block" : "none";
}

function savePlaceCache(items){
  try{
    const payload = { ts: Date.now(), items };
    localStorage.setItem(PLACE_CACHE_KEY, JSON.stringify(payload));
  }catch(_){}
}

function loadPlaceCache(){
  try{
    const raw = localStorage.getItem(PLACE_CACHE_KEY);
    if (!raw) return null;
    const obj = JSON.parse(raw);
    if (!obj?.ts || !Array.isArray(obj.items)) return null;
    if (Date.now() - obj.ts > PLACE_CACHE_TTL_MS) return null;
    return obj.items;
  }catch(_){ return null; }
}

async function fetchWithTimeout(url, ms){
  const controller = new AbortController();
  const t = setTimeout(() => controller.abort(), ms);
  try{
    const res = await fetch(url, { cache:"no-store", signal: controller.signal });
    if (!res.ok) throw new Error("HTTP " + res.status);
    return await res.json();
  }finally{
    clearTimeout(t);
  }
}

function fillPlaceSelect(items){
  const sel = document.getElementById("custPlace");
  sel.innerHTML = `<option value="">場所を選択してください</option>`;

  for (const it of items){
    const label = `${formatDateMdJaFromISO(it.date)} ${it.title}`;
    const o = document.createElement("option");
    o.value = label;
    o.textContent = label;
    sel.appendChild(o);
  }
}

async function loadPlaces(){
  const loading = document.getElementById("placeLoading");
  try{
    setPlaceStatusNote("");
    setManualMode(false);

    const cached = loadPlaceCache();
    if (cached && cached.length){
      fillPlaceSelect(cached);
      if (loading) loading.textContent = "出店日程（キャッシュ表示）";
    }

    const data = await fetchWithTimeout(ICAL_PROXY_URL, PLACE_FETCH_TIMEOUT_MS);
    const items = Array.isArray(data.items) ? data.items : [];
    if (!items.length) throw new Error("no items");

    fillPlaceSelect(items);
    savePlaceCache(items);
    if (loading) loading.textContent = `出店日程：最新を表示中（〜${SHOW_DAYS}日）`;

  }catch(e){
    if (loading) loading.textContent = "出店日程の読み込みに失敗しました";
    setPlaceStatusNote("読み込みに失敗したので、手入力に切り替えできます");
    setManualMode(true);
  }
}

function getPlaceValue(){
  const manualWrap = document.getElementById("manualPlaceWrap");
  if (manualWrap && manualWrap.style.display !== "none"){
    return safeText(document.getElementById("custPlaceManual").va
