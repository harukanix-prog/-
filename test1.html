<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>🐧 ぺんぎんKITCHEN ご予約</title>
  <style>
    /* 北欧ナチュラルなカラー設定 */
    :root {
      --main-blue: #8dbbc2; /* くすみブルー */
      --bg-cream: #fdfaf5;  /* アイボリー */
      --line-green: #06C755;
      --accent-beige: #e8c59c; /* テラコッタベージュ */
      --text-main: #4a4a4a;
      --card-white: #ffffff;
    }
    body { 
      margin: 0; 
      background: var(--bg-cream); 
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif; 
      color: var(--text-main); 
    }
    #pg-form { max-width: 600px; margin: 0 auto; padding: 16px 16px 180px; }
    h1 { text-align: center; color: var(--main-blue); font-size: 22px; margin: 10px 0 20px; font-weight: 900; }

    /* 出店情報：角を丸く、優しく */
    .pg-fixed-info { 
      background: var(--card-white); 
      border-radius: 20px; 
      padding: 16px; 
      margin-bottom: 16px; 
      border: 2px solid var(--main-blue); 
      line-height: 1.8; 
      font-size: 15px; 
    }
    .pg-fixed-info strong { color: var(--main-blue); }

    /* 案内文：吹き出し風 */
    .pg-info-box { 
      background: #fff; 
      border: 1px dashed var(--main-blue); 
      padding: 14px; 
      border-radius: 15px; 
      margin-bottom: 20px; 
      font-size: 14px; 
      line-height: 1.6; 
      position: relative;
    }

    /* メニュー画像：角を大きく丸く */
    .pg-menu-image { width: 100%; display: block; border-radius: 20px; margin-bottom: 24px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }

    /* 入力エリア */
    .pg-card { background: var(--card-white); padding: 16px; border-radius: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .pg-title { font-weight: 900; font-size: 14px; margin-bottom: 10px; color: var(--main-blue); display: block; }
    .pg-input-field { 
      width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 15px; 
      font-size: 16px; box-sizing: border-box; outline: none; transition: 0.3s;
    }
    .pg-input-field:focus { border-color: var(--main-blue); }

    /* メニューリスト */
    .pg-section-tag { 
      padding: 8px 16px; border-radius: 20px; margin: 24px 0 10px; 
      font-size: 15px; font-weight: 900; background: var(--accent-beige); color: white; display: inline-block;
    }
    .pg-row { 
      display: flex; align-items: center; justify-content: space-between; 
      padding: 14px 8px; border-bottom: 1px solid #eee; gap: 10px; 
    }
    .pg-item-name { font-weight: 900; font-size: 16px; }
    .pg-price-tag { color: #cc7e6d; font-size: 14px; font-weight: 900; }
    .pg-qty-input { 
      width: 60px; height: 40px; border: 2px solid #eee; border-radius: 12px; 
      font-size: 18px; font-weight: 900; text-align: center; background: #fafafa;
    }
    .pg-qty-input.has-value { border-color: var(--main-blue); background: #fff; color: var(--main-blue); }

    /* フッター */
    .pg-footer-bar { 
      position: fixed; bottom: 0; left: 0; width: 100%; background: #fff; 
      padding: 20px 16px 30px; border-top: 1px solid #eee; text-align: center; z-index: 9999; box-sizing: border-box; 
    }
    .pg-total-txt { font-size: 16px; font-weight: 900; margin-bottom: 12px; }
    .pg-total-num { font-size: 28px; color: #cc7e6d; margin: 0 4px; }
    
    .pg-btn-line { 
      display: block; background: #ccc; color: #fff; text-decoration: none; 
      padding: 18px; border-radius: 50px; font-weight: 900; font-size: 17px; transition: 0.3s;
    }
    .pg-btn-line.active { background: var(--line-green); box-shadow: 0 4px 15px rgba(6, 199, 85, 0.3); }
  </style>
</head>
<body>

<div id="pg-form">
  <h1>🐧 ぺんぎんKITCHEN</h1>

  <div class="pg-fixed-info">
    <div><strong>🗓 ご予約日：</strong><span id="infoDate"></span></div>
    <div><strong>📍 出店場所：</strong><span id="infoPlace"></span></div>
    <div><strong>⏰ 営業時間：</strong><span id="infoHours"></span></div>
  </div>

  <div class="pg-info-box">
    ぺんぎんKITCHENへようこそ！<br>
    事前予約で、お待たせせずに焼きたてをお渡しします🐧✨
  </div>

  <div class="pg-card">
    <span class="pg-title">● お名前</span>
    <input type="text" id="custName" class="pg-input-field" placeholder="ぺんぎん太郎" />
  </div>

  <div class="pg-card">
    <span class="pg-title">● お受け取り時間</span>
    <select id="custTime" class="pg-input-field">
      <option value="">読み込み中…</option>
    </select>
  </div>

  <div id="menuImageArea"></div>
  <div id="menuArea"></div>
</div>

<div class="pg-footer-bar">
  <div class="pg-total-txt">合計金額:<span class="pg-total-num" id="total-val">0</span>円</div>
  <a href="javascript:void(0)" id="sendLineBtn" class="pg-btn-line">お名前・時間・メニューを入力してね</a>
</div>

<script>
const SPREADSHEET_ID = "1Mz9fN_RMrfDx_ZbYYfmAdgK_srKiW3DkqShJCk8K2sw";
const LINE_SEND_URL_BASE = "https://line.me/R/msg/text/?";
let infoDataObj = { date: "", place: "", hours: "" };

function safeText(v){ return (v ?? "").toString().trim(); }

function buildTimeOptions(hourRange) {
  const select = document.getElementById("custTime");
  select.innerHTML = '<option value="">時間を選んでね</option>';
  if (!hourRange || !hourRange.includes(":")) return;
  const parts = hourRange.split(/[-〜~ー]/);
  if (parts.length !== 2) return;
  try {
    const toMin = (s) => { let [h,m]=s.trim().split(':').map(Number); return h*60+m; };
    const startM = toMin(parts[0]);
    const endM = toMin(parts[1]);
    for (let m = startM; m <= endM; m += 15) {
      let h = Math.floor(m / 60).toString().padStart(2,'0');
      let min = (m % 60).toString().padStart(2,'0');
      let opt = document.createElement("option");
      opt.value = `${h}:${min}`; opt.textContent = `${h}:${min}`;
      select.appendChild(opt);
    }
  } catch(e){}
}

async function loadMenu(){
  const params = new URLSearchParams(window.location.search);
  const sheetName = params.get("sheet") || "tanakamenu";
  const url = `https://opensheet.elk.sh/${SPREADSHEET_ID}/${sheetName}`;
  try {
    const res = await fetch(url);
    const data = await res.json();
    data.forEach(r => {
      const c = safeText(r.category);
      if(c === "info_date") infoDataObj.date = safeText(r.name);
      if(c === "info_place") infoDataObj.place = safeText(r.name);
      if(c === "info_hours") infoDataObj.hours = safeText(r.name);
    });
    document.getElementById("infoDate").innerText = infoDataObj.date;
    document.getElementById("infoPlace").innerText = infoDataObj.place;
    document.getElementById("infoHours").innerText = infoDataObj.hours;
    buildTimeOptions(infoDataObj.hours);

    const imgArea = document.getElementById("menuImageArea");
    data.filter(it => safeText(it.category)==="header").forEach(it => {
      const src = it.image || it.drive_link;
      if(src){ let img=document.createElement("img"); img.src=src; img.className="pg-menu-image"; imgArea.appendChild(img); }
    });

    const menuArea = document.getElementById("menuArea");
    const items = data.filter(it => it.active === "TRUE" && it.price && !safeText(it.category).startsWith("info_") && safeText(it.category) !== "header");
    const cats = [...new Set(items.map(it => it.category))];
    cats.forEach(c => {
      let tag=document.createElement("div"); tag.className="pg-section-tag"; tag.innerText=c;
      menuArea.appendChild(tag);
      items.filter(it => it.category === c).forEach(item => {
        let row=document.createElement("div"); row.className="pg-row";
        row.innerHTML=`<div class="pg-item-left"><div class="pg-item-name">${item.name}</div><span class="pg-price-tag">${item.price}円</span></div>
          <div class="pg-qty-wrap"><input type="number" class="pg-qty-input" data-name="${item.name}" data-price="${item.price}" value="0" min="0" oninput="updateUI()"></div>`;
        menuArea.appendChild(row);
      });
    });
  } catch(e){}
}

function updateUI(){
  const name = safeText(document.getElementById("custName").value);
  const time = safeText(document.getElementById("custTime").value);
  const inputs = document.querySelectorAll(".pg-qty-input");
  let total = 0, hasItem = false;
  inputs.forEach(el => {
    let q = parseInt(el.value) || 0;
    if(q > 0){ total += q * parseInt(el.dataset.price); hasItem = true; el.classList.add("has-value"); }
    else el.classList.remove("has-value");
  });
  document.getElementById("total-val").innerText = total.toLocaleString();
  
  const btn = document.getElementById("sendLineBtn");
  if(name && time && hasItem) {
    btn.classList.add("active");
    btn.innerText = "LINEで予約内容を送る";
  } else {
    btn.classList.remove("active");
    btn.innerText = "お名前・時間・メニューを入力してね";
  }
}

document.getElementById("sendLineBtn").onclick = () => {
  if(!document.getElementById("sendLineBtn").classList.contains("active")) return;
  const name = safeText(document.getElementById("custName").value);
  const time = safeText(document.getElementById("custTime").value);
  const inputs = document.querySelectorAll(".pg-qty-input");
  let list = [], total = 0, count = 0;
  inputs.forEach(el => {
    let q = parseInt(el.value) || 0;
    if(q > 0){ list.push(`${el.dataset.name} ×${q}`); total += q * parseInt(el.dataset.price); count += q; }
  });
  const msg = `【${time}】\n\n${list.join("\n")}\n\nーーーーーーーーーー\n${name}様\n合計 : ${count}枚 / ${total}円\n${infoDataObj.date} ${infoDataObj.place}`;
  location.href = LINE_SEND_URL_BASE + encodeURIComponent(msg);
};
document.getElementById("custName").oninput = updateUI;
document.getElementById("custTime").onchange = updateUI;
loadMenu();
</script>
</body>
</html>
