<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阪和第一泉北病院 ご予約フォーム</title>

<style>

body{
font-family:sans-serif;
background:#f6f6f6;
margin:0;
padding:0;
}

#pg-form{
max-width:520px;
margin:auto;
padding:20px;
}

h1{
text-align:center;
font-size:20px;
margin-bottom:20px;
}

.pg-fixed-info{
background:#ffffff;
border-radius:10px;
padding:12px;
margin-bottom:16px;
box-shadow:0 2px 6px rgba(0,0,0,0.08);
font-size:14px;
line-height:1.6;
}

.pg-info-box{
background:#fff8e8;
border:2px solid #f0c36d;
padding:14px;
border-radius:10px;
margin:12px 0 18px 0;
font-size:14px;
line-height:1.6;
}

.pg-card{
background:#ffffff;
border-radius:10px;
padding:14px;
margin-bottom:14px;
box-shadow:0 2px 6px rgba(0,0,0,0.08);
}

.pg-title{
font-weight:bold;
font-size:14px;
display:block;
margin-bottom:6px;
}

.pg-input-field{
width:100%;
padding:10px;
border-radius:6px;
border:1px solid #ccc;
font-size:14px;
}

.pg-total{
text-align:center;
font-size:20px;
margin:20px 0;
}

.pg-submit{
width:100%;
padding:16px;
border:none;
border-radius:30px;
background:#ddd;
font-size:16px;
}

</style>
</head>

<body>

<div id="pg-form">

<h1>🐧 阪和第一泉北病院 ご予約注文フォーム</h1>

<div class="pg-fixed-info">
<div><strong>ご予約日：</strong>2026/03/11(水)</div>
<div><strong>出店場所：</strong>阪和第一泉北病院</div>
<div><strong>営業時間：</strong>11:00〜16:00</div>
</div>

<div class="pg-info-box">
🐧 事前予約でスムーズにお渡しできます<br><br>

📱 お会計は当日キッチンカーでOK<br>
（現金・各種キャッシュレス対応）<br><br>

✨ 混雑時も予約のお客様を優先してお渡しします<br><br>

※こちらは事前注文のみの受付です<br>
※お支払いは当日、キッチンカーにてお願いいたします
</div>

<div class="pg-card">
<span class="pg-title">■ お名前</span>
<input type="text" id="custName" class="pg-input-field" placeholder="例：ぺんぎん太郎">
</div>

<div class="pg-card">
<span class="pg-title">■ お受け取り希望時間</span>

<select id="custTime" class="pg-input-field">
<option value="">時間を選択してください</option>
<option>11:00</option>
<option>11:30</option>
<option>12:00</option>
<option>12:30</option>
<option>13:00</option>
<option>13:30</option>
<option>14:00</option>
<option>14:30</option>
<option>15:00</option>
<option>15:30</option>
</select>

</div>

<div class="pg-total">
合計：0円
</div>

<button class="pg-submit">
お名前・時間・メニューを入力してね
</button>

</div>

</body>
</html>
