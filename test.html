<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>テストページ</title>
  <style>
    body{
      font-family: sans-serif;
      padding: 24px;
      line-height: 1.7;
      background: #f6f6f6;
      color: #333;
    }
    .box{
      max-width: 640px;
      margin: 40px auto;
      background: #fff;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      text-align: center;
    }
    h1{
      margin-top: 0;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>🐧 テストページ</h1>
    <p>GitHub Pages のテスト表示に成功しました。</p>
    <p>ここで予約ページの調整を試していきます😎</p>
  </div>
</body>
</html>
